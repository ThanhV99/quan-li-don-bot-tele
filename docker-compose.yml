# Project bot: chỉ phần Telegram, không database / logic – mọi thứ gọi web API (API_URL + SERVICE_TOKEN).
# Chạy:  cd bot && docker compose up -d --build   (sau khi stack web đã chạy)
# Lần đầu trên máy chủ: docker network create quan-li-don   (mạng chung với stack web)
name: quan-li-don-bot

services:
  bot:
    build: .
    image: quan-li-don-bot
    container_name: quan-li-don-bot
    restart: unless-stopped  # web chưa lên: bot chờ tối đa 2 phút rồi thoát, Docker tự chạy lại
    env_file: .env
    environment:
      # web cùng máy, cùng mạng docker quan-li-don; web ở máy khác → đặt API_URL trong .env
      API_URL: ${API_URL:-http://quan-li-don-web:8000}
      TZ: Asia/Ho_Chi_Minh
    user: "1000:1000"
    networks: [quan-li-don]
    # bot ghi heartbeat (qua API) mỗi phút (bot.heartbeat_loop); quá 3 phút không ghi = unhealthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, remote; remote.install(); import db; _, age = db.bot_heartbeat_age(); sys.exit(0 if age is not None and age <= db.BOT_STALE_SECONDS else 1)"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  quan-li-don:
    external: true  # tạo 1 lần: docker network create quan-li-don
